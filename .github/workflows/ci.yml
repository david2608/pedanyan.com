name: Build website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production website
        run: npm run build

      - name: Verify deployable output
        run: |
          test -s dist/index.html
          test -s dist/.htaccess
          test -d dist/assets

      - name: Store production build
        uses: actions/upload-artifact@v6
        with:
          name: pedanyan-production-site
          path: dist/
          if-no-files-found: error
          retention-days: 14
