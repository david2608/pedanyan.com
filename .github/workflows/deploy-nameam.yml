name: Deploy to Name.am

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: nameam-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The build prerenders every route with a real browser (see
      # scripts/prerender.mjs). Without this step `npm run build` produces the
      # old empty-shell HTML and the site quietly stops being indexable.
      - name: Install Chromium for prerendering
        run: npx playwright install --with-deps chromium

      - name: Build production website
        # The GA4 measurement ID lives in .env.production. It is a public
        # identifier - it ships inside the bundle either way - so it is not a
        # secret, and keeping it in the repo means a deploy needs no setup.
        run: npm run build

      - name: Verify deployable output
        run: |
          test -s dist/index.html
          test -s dist/.htaccess
          test -d dist/assets
          test -s dist/robots.txt
          test -s dist/sitemap.xml
          test -s dist/404.html
          # Prerendering must have produced real per-route HTML. An empty
          # #root here means every crawler would see a blank page.
          test -s dist/am/projects/cloudchipr/index.html
          test -s dist/am/portfolio/index.html
          grep -q 'Case Study by Davit Pedanyan' dist/am/projects/cloudchipr/index.html
          grep -q 'application/ld+json' dist/index.html
          ! grep -q '<div id="root"></div>' dist/am/projects/cloudchipr/index.html

      - name: Install secure FTP client
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: Deploy build to Name.am
        env:
          NAMEAM_FTP_HOST: ${{ secrets.NAMEAM_FTP_HOST }}
          NAMEAM_FTP_USERNAME: ${{ secrets.NAMEAM_FTP_USERNAME }}
          NAMEAM_FTP_PASSWORD: ${{ secrets.NAMEAM_FTP_PASSWORD }}
          NAMEAM_FTP_PATH: ${{ secrets.NAMEAM_FTP_PATH }}
        run: |
          test -n "$NAMEAM_FTP_HOST"
          test -n "$NAMEAM_FTP_USERNAME"
          test -n "$NAMEAM_FTP_PASSWORD"
          test -n "$NAMEAM_FTP_PATH"
          lftp -c "
            set cmd:fail-exit yes;
            set net:max-retries 2;
            set net:timeout 20;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            open --user \"$NAMEAM_FTP_USERNAME\" --password \"$NAMEAM_FTP_PASSWORD\" \"$NAMEAM_FTP_HOST\";
            mirror --reverse --only-newer \
              --exclude-glob='.well-known*' \
              --exclude-glob='.ftpquota*' \
              --exclude-glob='error_log*' \
              --exclude-glob='artmart*' \
              --exclude-glob='cgi-bin*' \
              --exclude-glob='merlindesign.co*' \
              --exclude-glob='wp-*.php' \
              --exclude-glob='xmlrpc.php' \
              --exclude-glob='license.txt' \
              --exclude-glob='readme.html' \
              --verbose --parallel=4 dist/ \"$NAMEAM_FTP_PATH\";
            bye;
          "

      # Tell Bing, Yandex and Seznam that the URLs changed. Google does not
      # participate in IndexNow, so for Google the sitemap plus Search Console
      # remain the route. Production only — pinging on a staging deploy would
      # submit URLs that do not reflect what is live.
      - name: Notify IndexNow (Bing / Yandex / Seznam)
        if: ${{ inputs.environment == 'production' }}
        continue-on-error: true
        run: npm run indexnow
