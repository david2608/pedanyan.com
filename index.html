    <!-- The Person and WebSite entities are STATIC, in the served HTML, so they
         survive a crawler that runs no JavaScript at all. The per-route graph
         (WebPage / CreativeWork / Article) is added on top of this by
         src/seo/head.ts and baked in per route by scripts/prerender.mjs. -->
    <!-- The JSON-LD graph is injected by src/seo/head.ts on every route, which
         the prerender step bakes into each static file. A second copy used to
         sit here; it shared the same @id values so nothing conflicted, but it
         was a hand-maintained duplicate that had already fallen behind the
         generated one. One source. -->
    <!-- Noto Sans is the LIGA app's own typeface; the coded case-study screens use it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" />
