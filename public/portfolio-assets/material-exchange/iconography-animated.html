<title>Animated Icon System</title>
<style>
  * { box-sizing: border-box; }
  html, body {

  }
  body { display: grid; place-items: center; overflow-x: hidden; }

    position: relative;
    width: 100%;
    max-width: 1920px;
    background: #ffffff;
    overflow: hidden;
  }

    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }
  .artwork [fill="#747474"] {
    fill: #BFBFBF !important;
  }
  .replay {
    position: absolute;
    right: 18px;
    bottom: 18px;
    z-index: 50;
    appearance: none;
    border: 1px solid rgba(0,0,0,.12);
    border-radius: 999px;
    background: rgba(255,255,255,.92);
    color: #111;
    padding: 9px 13px;
    font: 650 12px/1 system-ui, sans-serif;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,.10);
    backdrop-filter: blur(10px);
  }
  .replay:hover { background: #fff; }
  .replay:focus-visible { outline: 3px solid rgba(88,73,224,.28); outline-offset: 3px; }
  @media (max-width: 700px) { .replay { right: 10px; bottom: 10px; } }
</style>

<script>
(() => {
  const stage = document.getElementById('stage');
  const svg = stage.querySelector('svg.artwork');
  if (!svg) return;

  const BLUE = '#5849E0';
  const GRID = '#0000FF';
  const RED = '#FF0000';

  const direct = Array.from(svg.children);
  const baseGroup = direct.find(el => el.tagName.toLowerCase() === 'g' && el.hasAttribute('clip-path'));
  const baseEls = baseGroup ? Array.from(baseGroup.children) : [];
  const drawables = direct.filter(el => ['path','rect','circle','line','polyline','polygon','ellipse'].includes(el.tagName.toLowerCase()));

  const attr = (el, name) => (el.getAttribute(name) || '').toUpperCase();
  const hasVisibleStroke = el => {
    const s = attr(el, 'stroke');
    const sw = parseFloat(el.getAttribute('stroke-width') || '0');
    return !!s && s !== 'NONE' && sw > 0;
  };
  const hasVisibleFill = el => {
    const f = attr(el, 'fill');
    return !!f && f !== 'NONE' && f !== '';
  };
  const hasSvgTransform = el => el.hasAttribute('transform');
  function bbox(el) {
    try {
      const b = el.getBBox();
      return { x:b.x, y:b.y, w:b.width, h:b.height, cx:b.x + b.width / 2, cy:b.y + b.height / 2 };
    } catch {
      return { x:0, y:0, w:0, h:0, cx:0, cy:0 };
    }
  }
  function uniq(arr) { return [...new Set(arr.filter(Boolean))]; }
  function region(el) {
    const b = bbox(el);
    if (b.cx < 760) return 0;
    if (b.cx < 1135) return 1;
    return 2;
  }

  const purpleSmall = drawables.filter(el => {
    const b = bbox(el);
    return b.cy < 180 && (attr(el,'stroke') === BLUE || attr(el,'fill') === BLUE);
  });
  const heroGrid = drawables.filter(el => attr(el,'stroke') === GRID);
  const heroRed = drawables.filter(el => attr(el,'stroke') === RED || attr(el,'fill') === RED);
  const heroBold = drawables.filter(el => {
    const b = bbox(el);
    const sw = parseFloat(el.getAttribute('stroke-width') || '0');
    return b.cy > 260 && b.cy < 545 && attr(el,'stroke') === BLUE && sw >= 7;
  });
  const heroPurpleOther = drawables.filter(el => {
    const b = bbox(el);
    return b.cy > 215 && b.cy < 545 &&
      (attr(el,'stroke') === BLUE || attr(el,'fill') === BLUE) &&
      !heroBold.includes(el);
  });

  const firstBackgroundIcon = [...baseEls]
    .filter(el => { const b = bbox(el); return b.cy < 60; })
    .sort((a,b) => bbox(a).cx - bbox(b).cx)[0];

  // Hide the standard icon row that sits behind the custom purple icons.
  // Use a wider vertical band so no leftover background glyphs remain visible.
  const secondRowBackground = baseEls.filter(el => {
    const b = bbox(el);
    return b.cy > 70 && b.cy < 190;
  });

  const animatedEls = uniq([
    firstBackgroundIcon,
    ...purpleSmall,
    ...heroGrid,
    ...heroPurpleOther,
    ...heroBold,
    ...heroRed
  ]);

  const staticEls = uniq([
    ...baseEls,
    ...drawables.filter(el => !animatedEls.includes(el))
  ]).filter(el => !secondRowBackground.includes(el));

  let token = 0;
  let runAnimations = [];
  let ambientAnimations = [];
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function track(a, bucket=runAnimations) { bucket.push(a); return a; }
  function stopAnimations(list) { list.forEach(a => { try { a.cancel(); } catch {} }); list.length = 0; }
  function stopAll() { stopAnimations(runAnimations); stopAnimations(ambientAnimations); }

  function hide(el) {
    el.style.opacity = '0';
    el.style.strokeDasharray = '';
    el.style.strokeDashoffset = '';
  }
  function show(el) {
    el.style.opacity = '1';
    el.style.strokeDasharray = '';
    el.style.strokeDashoffset = '';
    el.style.transform = '';
  }

  function hidePermanent(el) {
    el.style.opacity = '0';
    el.style.strokeDasharray = '';
    el.style.strokeDashoffset = '';
    el.style.transform = '';
  }

  function reset() {
    stopAll();
    staticEls.forEach(show);
    secondRowBackground.forEach(hidePermanent);
    animatedEls.forEach(hide);
  }

  async function reveal(el, duration=200) {
    const a = el.animate([
      { opacity:0 },
      { opacity:1 }
    ], { duration, easing:'ease-out', fill:'forwards' });
    track(a);
    await a.finished.catch(()=>{});
    show(el);
  }

  async function drawPath(el, duration=360) {
    if (!hasVisibleStroke(el) || !(el instanceof SVGGeometryElement) || typeof el.getTotalLength !== 'function') {
      await reveal(el, Math.min(duration, 200));
      return;
    }
    let L = 0;
    try { L = el.getTotalLength(); } catch { L = 0; }
    if (!L || !Number.isFinite(L)) {
      await reveal(el, Math.min(duration, 200));
      return;
    }
    el.style.opacity = hasVisibleFill(el) ? '.15' : '1';
    el.style.strokeDasharray = `${L} ${L}`;
    el.style.strokeDashoffset = `${L}`;
    const frames = hasVisibleFill(el)
      ? [{ opacity:.15, strokeDashoffset:L }, { opacity:1, strokeDashoffset:0 }]
      : [{ opacity:1, strokeDashoffset:L }, { opacity:1, strokeDashoffset:0 }];
    const a = el.animate(frames, { duration, easing:'cubic-bezier(.18,.78,.18,1)', fill:'forwards' });
    track(a);
    await a.finished.catch(()=>{});
    el.style.opacity = '1';
    el.style.strokeDashoffset = '0';
  }

  async function animateBatch(elements, options={}) {
    const { stagger=22, duration=360, sort='x' } = options;
    const group = [...elements].sort((a,b) => {
      const A = bbox(a), B = bbox(b);
      return sort === 'y' ? (A.cy - B.cy || A.cx - B.cx) : (A.cx - B.cx || A.cy - B.cy);
    });
    await Promise.all(group.map(async (el, i) => {
      if (i) await sleep(Math.min(i * stagger, 240));
      await drawPath(el, duration);
    }));
  }

  function splitByRegion(elements) {
    return [0,1,2].map(r => elements.filter(el => region(el) === r));
  }

  function startAmbient() {
    stopAnimations(ambientAnimations);
    const topGroup = purpleSmall;
    const leftGroup = uniq([...splitByRegion(uniq([...heroGrid, ...heroPurpleOther, ...heroBold]))[0], ...splitByRegion(heroRed)[0]]);
    const centerGroup = uniq([...splitByRegion(uniq([...heroGrid, ...heroPurpleOther, ...heroBold]))[1], ...splitByRegion(heroRed)[1]]);
    const rightGroup = uniq([...splitByRegion(uniq([...heroGrid, ...heroPurpleOther, ...heroBold]))[2], ...splitByRegion(heroRed)[2]]);

    function animateGentle(el, cfg) {
      const moveable = !hasSvgTransform(el);
      const frames = moveable ? [
        { transform: 'translate(0px, 0px)', opacity: 1 },
        { transform: `translate(${cfg.x}px, ${cfg.y}px)`, opacity: cfg.opacity },
        { transform: 'translate(0px, 0px)', opacity: 1 }
      ] : [
        { opacity: 1 },
        { opacity: cfg.opacity },
        { opacity: 1 }
      ];
      const a = el.animate(frames, {
        duration: cfg.duration,
        delay: cfg.delay,
        easing: 'ease-in-out',
        iterations: Infinity
      });
      track(a, ambientAnimations);
    }

    topGroup.forEach((el, i) => animateGentle(el, { x:0, y:-2, opacity:.95, duration:2600, delay:i*24 }));
    leftGroup.forEach((el, i) => animateGentle(el, { x:-1.2, y:-1.8, opacity:.98, duration:2950, delay:60+i*8 }));
    centerGroup.forEach((el, i) => animateGentle(el, { x:0, y:-2.2, opacity:.975, duration:3100, delay:130+i*8 }));
    rightGroup.forEach((el, i) => animateGentle(el, { x:1.2, y:-1.6, opacity:.98, duration:3000, delay:90+i*8 }));

    heroRed.forEach((el, i) => {
      const a = el.animate([
        { opacity: 1 },
        { opacity: .76 },
        { opacity: 1 }
      ], { duration: 1900, delay: i * 18, easing: 'ease-in-out', iterations: Infinity });
      track(a, ambientAnimations);
    });
  }

  async function play() {
    const my = ++token;
    reset();
    await sleep(80);
    if (my !== token) return;

    if (firstBackgroundIcon) {
      await drawPath(firstBackgroundIcon, 320);
      await sleep(70);
    }

    await animateBatch(purpleSmall, { stagger: 22, duration: 320, sort: 'x' });
    if (my !== token) return;
    await sleep(100);

    const [gridL, gridC, gridR] = splitByRegion(heroGrid);
    const [purpleL, purpleC, purpleR] = splitByRegion(uniq([...heroPurpleOther, ...heroBold]));
    const [redL, redC, redR] = splitByRegion(heroRed);

    for (const regionSet of [
      { grid:gridL, purple:purpleL, red:redL },
      { grid:gridC, purple:purpleC, red:redC },
      { grid:gridR, purple:purpleR, red:redR }
    ]) {
      if (my !== token) return;
      await animateBatch(regionSet.grid, { stagger: 14, duration: 360, sort: 'y' });
      if (my !== token) return;
      await animateBatch(regionSet.purple, { stagger: 16, duration: 390, sort: 'y' });
      if (my !== token) return;
      await animateBatch(regionSet.red, { stagger: 12, duration: 280, sort: 'x' });
      await sleep(130);
    }

    if (my !== token) return;
    startAmbient();
  }

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    staticEls.forEach(show);
    secondRowBackground.forEach(hidePermanent);
    animatedEls.forEach(show);
  } else {
    reset();
    window.addEventListener('message', (event) => {
      if (event.origin !== window.location.origin) return;
      if (event.data === 'iconography:play') requestAnimationFrame(play);
      if (event.data === 'iconography:stop') {
        token += 1;
        stopAll();
      }
    });
  }
})();
</script>
