    if (l1 > l2) {
      const d = attr(e.path,'d');
      const rd = reverseSimpleCubicPath(d);
      if (rd !== d) e.path.setAttribute('d', rd);
      const tmp = e.n1; e.n1 = e.n2; e.n2 = tmp;
    }
    const ep = lineEndpoints(e.path);
    e.a = ep.a; e.b = ep.b; e.L = ep.L;
    e.edgeLevel = Math.min(level.get(e.n1), level.get(e.n2));
  });

  const edgeGroups = new Map();
  for (let l=0; l<maxLevel; l++) edgeGroups.set(l, edges.filter(e => e.edgeLevel === l));
  const nodeGroups = new Map();
  for (let l=0; l<=maxLevel; l++) nodeGroups.set(l, connectedNodes.filter(n => level.get(n) === l));

  let activeAnimations = [];
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function stopAnimations() {
    activeAnimations.forEach(a => { try { a.cancel(); } catch {} });
    activeAnimations = [];
  }

  function setNodeHidden(n) {
    (nodeParts.get(n) || []).forEach(el => {
      el.style.opacity = '0';
      el.style.transformBox = 'fill-box';
      el.style.transformOrigin = 'center';
      el.style.transform = 'scale(.94)';
    });
  }

  function setNodeVisible(n) {
    (nodeParts.get(n) || []).forEach(el => {
      el.style.opacity = '1';
      el.style.transform = 'scale(1)';
    });
  }

  function reset() {
    stopAnimations();
    connectedNodes.forEach(setNodeHidden);
    markers.forEach(m => m.style.opacity = '0');
    edges.forEach(e => {
      const L = e.path.getTotalLength();
      e.L = L;
      e.path.style.strokeDasharray = `${L} ${L}`;
      e.path.style.strokeDashoffset = `${L}`;
      e.path.style.opacity = '1';
    });
    diagram.style.opacity = '1';
  }

  function animateParts(parts, keyframes, options) {
    return Promise.all(parts.map(el => {
      const a = el.animate(keyframes, options);
      activeAnimations.push(a);
      return a.finished.catch(() => {});
    }));
  }

  async function revealNode(n, duration=120) {
    const parts = nodeParts.get(n) || [];
    await animateParts(parts,
      [{opacity:0, transform:'scale(.94)'}, {opacity:1, transform:'scale(1)'}],
      {duration, easing:'cubic-bezier(.2,.8,.2,1)', fill:'forwards'}
    );
    setNodeVisible(n);
  }

  async function drawEdge(e, duration) {
    const L = e.path.getTotalLength();
    e.path.style.strokeDasharray = `${L} ${L}`;
    e.path.style.strokeDashoffset = `${L}`;
    const a = e.path.animate(
      [{strokeDashoffset:L}, {strokeDashoffset:0}],
      {duration, easing:'cubic-bezier(.2,.72,.18,1)', fill:'forwards'}
    );
    activeAnimations.push(a);
    await a.finished.catch(() => {});
    e.path.style.strokeDashoffset = '0';
  }

  function showMarkersForEdgeLevel(edgeLevel, duration=60) {
    const relevantEdges = edgeGroups.get(edgeLevel) || [];
    const pts = relevantEdges.flatMap(e => [e.a,e.b]);
    markers.forEach(m => {
      const b = m.getBBox(); const c = {x:b.x+b.width/2, y:b.y+b.height/2};
      if (!pts.some(p => Math.hypot(c.x-p.x,c.y-p.y) < 5)) return;
      const a = m.animate([{opacity:0},{opacity:1}],{duration,fill:'forwards',easing:'ease-out'});
      activeAnimations.push(a);
    });
  }

  function edgeChildCenter(edge) {
    const b = rectBox(edge.n2);
    return { x: b.x + b.w / 2, y: b.y + b.h / 2 };
  }

  function chunk(array, size) {
    const out = [];
    for (let i = 0; i < array.length; i += size) out.push(array.slice(i, i + size));
    return out;
  }

  function uniqueNodes(items) {
    return [...new Set(items)];
  }

  let loopEnabled = false;
  let runId = 0;

  async function play(token) {
    reset();
    await sleep(60);
    if (token !== runId) return;

    // 1) Starting point: MAT-EX.
    await revealNode(centerRect, 165);
    await sleep(70);
    if (token !== runId) return;

    // 2) Grow the hierarchy level by level, but in small branch batches.
    for (let l=0; l<maxLevel; l++) {
      const rawGroup = edgeGroups.get(l) || [];
      const group = [...rawGroup].sort((a, b) => {
        const ac = edgeChildCenter(a);
        const bc = edgeChildCenter(b);
        return ac.y - bc.y || ac.x - bc.x;
      });

      const duration = l === 0 ? 410 : 350;
      const batchSize = l === 0 ? 2 : 3;
      const batchGap = l === 0 ? 90 : 70;
      const nodeGap = 35;
      const batches = chunk(group, batchSize);

      for (const batch of batches) {
        if (token !== runId) return;
        await Promise.all(batch.map(e => drawEdge(e, duration)));
        showMarkersForEdgeLevel(l, 55);
        await sleep(35);

        const childNodes = uniqueNodes(batch.map(e => e.n2)).sort((a, b) => {
          const ab = rectBox(a);
          const bb = rectBox(b);
          return ab.y - bb.y || ab.x - bb.x;
        });

        await Promise.all(childNodes.map((n, i) => (async () => {
          if (i) await sleep(i * nodeGap);
          await revealNode(n, 110);
        })()));

        await sleep(batchGap);
      }
    }
  }

  async function startLoop() {
    if (loopEnabled) return;
    loopEnabled = true;
    const token = ++runId;
    while (loopEnabled && token === runId) {
      await play(token);
      if (!loopEnabled || token !== runId) return;
      await sleep(500);
    }
  }

  function stopLoop() {
    loopEnabled = false;
    runId += 1;
    reset();
  }

  // Respect reduced-motion while still revealing the final diagram.
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    reset();
    connectedNodes.forEach(setNodeVisible);
    markers.forEach(m => m.style.opacity='1');
    edges.forEach(e => e.path.style.strokeDashoffset='0');
  } else {
    window.addEventListener('message', event => {
      if (event.origin !== window.location.origin || event.source !== window.parent) return;
      if (event.data === 'matex:play') startLoop();
      if (event.data === 'matex:stop') stopLoop();
    });
  }
})();
</script>
</body>
</html>
