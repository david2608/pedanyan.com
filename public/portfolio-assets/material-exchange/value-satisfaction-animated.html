<title>Value vs. Satisfaction — Interactive Discussion</title>
<style>
:root {
  --blue:#1266f5;
  --green:#00ae58;
  --orange:#ff823d;
  --ink:#111;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#viewport{position:relative;width:100vw;height:100vh;background:#fff;overflow:hidden}
#viewport::after{content:"";position:absolute;z-index:50;inset:0;box-shadow:inset 0 0 0 6px #fff;pointer-events:none}
#canvas{position:absolute;width:3316px;height:1734px;transform-origin:0 0;will-change:transform}
#base{position:absolute;inset:0;width:3316px;height:1734px;display:block;user-select:none;pointer-events:none}
#links{position:absolute;inset:0;width:3316px;height:1734px;overflow:visible;pointer-events:none;z-index:8}
.link-path{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:0;filter:drop-shadow(0 1px 0 rgba(255,255,255,.55))}
.link-tail{fill:none;stroke-width:2;stroke-linecap:round;opacity:.3;stroke-dasharray:7 8}
.item{position:absolute;display:block;opacity:0;transform-origin:center;will-change:transform,opacity;filter:drop-shadow(0 2px 2px rgba(0,0,0,.02));user-select:none}
.item.card{cursor:pointer}
.item.card:hover{filter:drop-shadow(0 10px 18px rgba(0,0,0,.12))}
.cursor{position:absolute;display:flex;align-items:flex-start;gap:4px;opacity:0;z-index:30;transform:translate(-6px,-8px);will-change:left,top,opacity;pointer-events:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.18))}
.cursor .pointer{width:24px;height:29px;flex:none;margin-top:-9px;margin-right:-4px;overflow:visible}
.cursor .name{display:block;color:#fff;font:500 22px/1.15 Inter,ui-sans-serif,system-ui,sans-serif;padding:4px 8px 5px;white-space:nowrap;background:var(--cursor-color);box-shadow:0 2px 8px rgba(0,0,0,.10)}
.cursor .pointer-fill{fill:var(--cursor-color)}
.cursor .pointer-outline{fill:none;stroke:#fff;stroke-width:1.55;stroke-linejoin:round}
.pulse{position:absolute;width:36px;height:36px;border-radius:50%;border:4px solid #18c66a;opacity:0;pointer-events:none;z-index:25}
</style>

    {"type":"card","id":"card15","participant":"davit","delay":110}
  ];
  const validated=new Set(["card3", "card5", "card7", "card8", "card9", "card11"]);
  const canvas=document.getElementById('canvas');
  const viewport=document.getElementById('viewport');

  const all={};
  [...cardData,...commentData].forEach(d=>{
    const el=document.createElement('img');
    el.src=d.src;
    el.id=d.id;
    el.className='item '+(d.id.startsWith('card')?'card':'comment');
    el.style.left=d.x+'px';
    el.style.top=d.y+'px';
    el.style.width=d.w+'px';
    el.style.height=d.h+'px';
    el.draggable=false;
    canvas.appendChild(el);
    all[d.id]={...d,el};
    if(d.id.startsWith('card')) {
      el.addEventListener('click', e=>{
        e.stopPropagation();
        el.animate([
          {transform:'scale(1)'},
          {transform:'scale(1.035)'},
          {transform:'scale(1)'}
        ],{duration:420,easing:'cubic-bezier(.2,.8,.2,1)'});
      });
    }
  });

  const links=document.getElementById('links');
  const participantMeta={
    davit:{name:'Davit Pedanyan',color:'#00AF5B',home:{x:150,y:365}},
    gohar:{name:'Gohar Gevorgyan',color:'#39AE61',home:{x:170,y:1185}},
    ani:{name:'Ani Atanesyan',color:'#FF46AA',home:{x:1800,y:110}},
    sergey:{name:'Sergey Tonyan',color:'#FF46AA',home:{x:2960,y:720}},
    vladimir:{name:'Vladimir Popov',color:'#466BFF',home:{x:1130,y:1600}},
    dejan:{name:'Dejan Zvekovic',color:'#A346FF',home:{x:1510,y:1570}}
  };
  const cursors={};
  const pointerSVG=`<svg class="pointer" viewBox="0 0 18 22" aria-hidden="true"><path class="pointer-fill" d="M14.04 9.67 1.03 1.52 3.86 17.24 7.25 11.42 14.04 9.67Z"/><path class="pointer-outline" d="M1.42.89 14.43 9.04 15.9 9.96 14.22 10.39 7.74 12.06 4.5 17.62 3.48 19.36 3.13 17.37.3 1.65 0 0 1.42.89Z"/></svg>`;
  Object.entries(participantMeta).forEach(([key,meta])=>{
    const el=document.createElement('div');
    el.className='cursor';
    el.style.setProperty('--cursor-color',meta.color);
    el.innerHTML=pointerSVG+'<span class="name">'+meta.name+'</span>';
    canvas.appendChild(el);
    cursors[key]={el,x:meta.home.x,y:meta.home.y,home:meta.home,color:meta.color};
  });

  function resize(){
    const s=Math.min(viewport.clientWidth/W,viewport.clientHeight/H);
    const left=(viewport.clientWidth-W*s)/2;
    const top=(viewport.clientHeight-H*s)/2;
    canvas.style.transform=`translate(${left}px,${top}px) scale(${s})`;
  }
  addEventListener('resize',resize); resize();

  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  let index=0;
  let auto=true;
  let generation=0;
  let running=false;

  function updateStatus(){
    return index;
  }

  function resetVisuals(){
    Object.values(all).forEach(o=>{
      o.el.getAnimations().forEach(a=>a.cancel());
      o.el.style.opacity='0';
      o.el.style.transform='none';
    });
    document.querySelectorAll('.pulse').forEach(p=>p.remove());
    links.querySelectorAll('.link-path,.link-tail').forEach(el=>el.remove());
    Object.values(cursors).forEach(c=>{
      c.el.getAnimations().forEach(a=>a.cancel());
      c.x=c.home.x;c.y=c.home.y;
      c.el.style.left=c.x+'px';c.el.style.top=c.y+'px';c.el.style.opacity='.88';
    });
    index=0;updateStatus();
  }

  function curvedPath(x1,y1,x2,y2){
    const dx=x2-x1, dy=y2-y1;
    const bend=Math.max(32, Math.min(120, Math.abs(dx)*0.14 + Math.abs(dy)*0.08));
    const cx1=x1 + dx*0.35;
    const cy1=y1 + (dy>=0 ? bend : -bend);
    const cx2=x1 + dx*0.72;
    const cy2=y2 + (dy>=0 ? -bend*0.35 : bend*0.35);
    return `M ${x1} ${y1} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x2} ${y2}`;
  }

  async function drawContributionArrow(name,from,to,token,persist=false){
    const meta=participantMeta[name]||participantMeta.davit;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    const tail=document.createElementNS('http://www.w3.org/2000/svg','path');
    const d=curvedPath(from.x,from.y,to.x,to.y);
    tail.setAttribute('d', d);
    tail.setAttribute('class','link-tail');
    tail.setAttribute('stroke', meta.color);
    tail.setAttribute('opacity','0');
    path.setAttribute('d', d);
    path.setAttribute('class','link-path');
    path.setAttribute('stroke', meta.color);
    path.setAttribute('marker-end', `url(#arrow-${name})`);
    links.appendChild(tail);
    links.appendChild(path);
    const len=path.getTotalLength();
    path.style.strokeDasharray = `${len} ${len}`;
    path.style.strokeDashoffset = `${len}`;
    const a1=tail.animate([{opacity:0},{opacity:.24}],{duration:100,fill:'forwards',easing:'ease-out'});
    const a2=path.animate([
      {opacity:0,strokeDashoffset:len},
      {opacity:.98,strokeDashoffset:0},
      {opacity:persist ? .48 : .42,strokeDashoffset:0}
    ],{duration:220,fill:'forwards',easing:'cubic-bezier(.2,.8,.2,1)'});
    await Promise.all([a1.finished.catch(()=>{}), a2.finished.catch(()=>{})]);
    if(token!==generation){ tail.remove(); path.remove(); return; }
    tail.style.opacity=persist?'.24':'.18';
    path.style.opacity=persist?'.48':'.42';
    path.style.strokeDashoffset='0';
    if(!persist){
      setTimeout(()=>{
        if(token!==generation){ tail.remove(); path.remove(); return; }
        const f1=tail.animate([{opacity:parseFloat(tail.style.opacity||'.18')},{opacity:0}],{duration:220,fill:'forwards'});
        const f2=path.animate([{opacity:parseFloat(path.style.opacity||'.42')},{opacity:0}],{duration:220,fill:'forwards'});
        Promise.all([f1.finished.catch(()=>{}), f2.finished.catch(()=>{})]).then(()=>{ tail.remove(); path.remove(); });
      }, 320);
    }
  }

  async function moveCursor(name,x,y,token){
    const c=cursors[name]||cursors.davit;
    const from={x:c.x,y:c.y};
    c.el.style.opacity='1';
    const anim=c.el.animate([
      {left:c.x+'px',top:c.y+'px',opacity:.8,transform:'translate(-6px,-8px) scale(.94)'},
      {left:x+'px',top:y+'px',opacity:1,transform:'translate(-6px,-8px) scale(1)'}
    ],{duration:170,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});
    await anim.finished.catch(()=>{});
    if(token!==generation)return {from, to:{x,y}};
    c.x=x;c.y=y;c.el.style.left=x+'px';c.el.style.top=y+'px';
    return {from, to:{x,y}};
  }

  async function validationPulse(o,token){
    if(!validated.has(o.id))return;
    const p=document.createElement('div');
    p.className='pulse';
    p.style.left=(o.x+o.w*.70)+'px';
    p.style.top=(o.y+24)+'px';
    canvas.appendChild(p);
    const a=p.animate([
      {opacity:0,transform:'scale(.35)'},
      {opacity:.85,transform:'scale(1)'},
      {opacity:0,transform:'scale(1.65)'}
    ],{duration:220,easing:'ease-out',fill:'forwards'});
    await a.finished.catch(()=>{});
    if(token===generation)p.remove();
  }

  async function revealCard(o,participant,token){
    const targetX=o.x+o.w*.72;
    const targetY=o.y+30;
    const hop=await moveCursor(participant,targetX,targetY,token);
    if(token!==generation)return;

    const offsets={
      blue:[-90,52],
      green:[92,-46],
      orange:[-62,-72]
    };
    const [dx,dy]=offsets[participant]||[-70,40];
    o.el.style.opacity='1';
    const a=o.el.animate([
      {opacity:0,transform:`translate(${dx}px,${dy}px) scale(.93) rotate(-.25deg)`},
      {opacity:1,transform:'translate(0,0) scale(1) rotate(0deg)'}
    ],{duration:260,easing:'cubic-bezier(.18,.82,.22,1)',fill:'forwards'});
    await a.finished.catch(()=>{});
    if(token!==generation)return;
    o.el.style.opacity='1';o.el.style.transform='none';
    validationPulse(o,token);
  }

  async function revealComment(o,participant,token){
    const hop=await moveCursor(participant,o.x+o.w*.22,o.y+o.h*.58,token);
    if(token!==generation)return;
    o.el.style.opacity='1';
    const a=o.el.animate([
      {opacity:0,transform:'translateY(10px) scale(.82)'},
      {opacity:1,transform:'translateY(0) scale(1.04)'},
      {opacity:1,transform:'translateY(0) scale(1)'}
    ],{duration:220,easing:'cubic-bezier(.2,.9,.25,1)',fill:'forwards'});
    await a.finished.catch(()=>{});
    o.el.style.opacity='1';o.el.style.transform='none';
  }

  function discussionPoint(item, slot='center'){
    const points={
      center:[item.x+item.w*.5,item.y+item.h*.5],
      top:[item.x+item.w*.55,item.y+18],
      right:[item.x+item.w+18,item.y+item.h*.45],
      left:[item.x-18,item.y+item.h*.45],
      bottom:[item.x+item.w*.45,item.y+item.h+18]
    };
    const [x,y]=points[slot]||points.center;
    return {x,y};
  }

  async function emphasizeItem(item, token){
    if(token!==generation || !item) return;
    const frames=item.id.startsWith('comment')
      ? [
          {transform:'scale(1)', filter:'drop-shadow(0 2px 2px rgba(0,0,0,.02))'},
          {transform:'scale(1.025)', filter:'drop-shadow(0 10px 18px rgba(0,0,0,.10))'},
          {transform:'scale(1)', filter:'drop-shadow(0 2px 2px rgba(0,0,0,.02))'}
        ]
      : [
          {transform:'translate(0,0) scale(1)'},
          {transform:'translate(0,-4px) scale(1.02)'},
          {transform:'translate(0,0) scale(1)'}
        ];
    const a=item.el.animate(frames,{duration:260,easing:'cubic-bezier(.2,.8,.2,1)'});
    await a.finished.catch(()=>{});
  }

  async function discussionMove(participant,id,slot,token){
    const item=all[id];
    if(!item) return;
    const point=discussionPoint(item, slot);
    const hop=await moveCursor(participant, point.x, point.y, token);
    if(token!==generation) return;
    await drawContributionArrow(participant, hop.from, hop.to, token, false);
    emphasizeItem(item, token);
  }

  async function discussionPhase(token){
    const waves=[
      [
        {participant:'davit', id:'card5', slot:'top'},
        {participant:'ani', id:'card4', slot:'right'},
        {participant:'gohar', id:'card9', slot:'left'}
      ],
      [
        {participant:'sergey', id:'comment0', slot:'bottom'},
        {participant:'vladimir', id:'card11', slot:'top'},
        {participant:'dejan', id:'card14', slot:'right'}
      ],
      [
        {participant:'ani', id:'card12', slot:'top'},
        {participant:'davit', id:'card15', slot:'left'},
        {participant:'gohar', id:'comment1', slot:'bottom'}
      ],
      [
        {participant:'sergey', id:'card8', slot:'top'},
        {participant:'vladimir', id:'card2', slot:'right'},
        {participant:'dejan', id:'card7', slot:'left'}
      ]
    ];

    for (const wave of waves) {
      if(token!==generation) return;
      await Promise.all(wave.map(async (move, i) => {
        if(i) await sleep(i*45);
        await discussionMove(move.participant, move.id, move.slot, token);
      }));
      await sleep(120);
    }
  }

  async function runEvent(event,token){
    const o=all[event.id];
    if(!o)return;
    if(event.type==='comment') await revealComment(o,event.participant,token);
    else await revealCard(o,event.participant,token);
  }

  async function step(){
    if(running || index>=sequence.length)return;
    running=true;
    const token=generation;
    const ev=sequence[index];
    await runEvent(ev,token);
    if(token===generation){
      index++;
      updateStatus();
    }
    running=false;
  }

  async function autoplay(){
    const token=generation;
    const batchSize=3;
    while(auto && index<sequence.length && token===generation){
      const batch=sequence.slice(index,index+batchSize);
      running=true;
      await Promise.all(batch.map(async (ev,i)=>{
        if(i) await sleep(i*55);
        await runEvent(ev,token);
      }));
      if(token!==generation || !auto){ running=false; break; }
      index+=batch.length;
      updateStatus();
      running=false;
      await sleep(90);
    }
    if(index>=sequence.length && token===generation && auto){
      await sleep(120);
      await discussionPhase(token);
    }
    if(index>=sequence.length && token===generation){
      Object.values(cursors).forEach(c=>{
        c.el.animate([{opacity:1},{opacity:.72}],{duration:220,fill:'forwards'});
      });
      auto=false;
    }
  }

  function replay(){
    generation++;
    running=false;
    resetVisuals();
    auto=true;
    const token=generation;
    setTimeout(()=>{if(token===generation)autoplay();},120);
  }

  function stopPresentation(){
    generation++;
    running=false;
    auto=false;
    resetVisuals();
    Object.values(cursors).forEach(c=>{ c.el.style.opacity='0'; });
    auto=false;
  }

  const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const parentControlled=window.parent!==window;

  addEventListener('message',(event)=>{
    if(event.origin!==location.origin || event.source!==window.parent)return;
    if(event.data==='value-satisfaction:play'){
      if(reducedMotion){
        Object.values(all).forEach(o=>o.el.style.opacity='1');
        index=sequence.length;updateStatus();auto=false;
      }else{
        replay();
      }
    }
    if(event.data==='value-satisfaction:stop')stopPresentation();
  });

  if(reducedMotion){
    Object.values(all).forEach(o=>o.el.style.opacity='1');
    index=sequence.length;updateStatus();auto=false;
  } else if(!parentControlled) {
    replay();
  }
})();
</script>
</body>
</html>
